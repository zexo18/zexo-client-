name: Extract ZEXO project

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          test -f zexo-full-project.zip
          rm -rf .zexo-extract
          mkdir .zexo-extract
          unzip -q zexo-full-project.zip -d .zexo-extract
          test -d .zexo-extract/zexo-project
          cp -a .zexo-extract/zexo-project/. .
          rm -rf .zexo-extract

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No extracted file changes."
            exit 0
          fi
          git commit -m "Extract ZEXO project files [skip ci]"
          git push